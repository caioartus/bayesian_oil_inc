<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Bayesian Oil Inc.</title>
  <meta name="description" content="A tiny pixel-art oil tycoon game that teaches Bayesian optimisation.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%23ffcd75'/><rect x='3' y='1' width='2' height='6' fill='%231a1c2c'/><rect x='2' y='6' width='4' height='1' fill='%231a1c2c'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="320" height="180" tabindex="0" aria-label="Bayesian Oil Inc. game"></canvas>
    <div id="touch" aria-hidden="true">
      <div class="pad">
        <button data-btn="left">&#9664;</button>
        <button data-btn="right">&#9654;</button>
      </div>
      <div class="pad">
        <button data-btn="b" class="b">B</button>
        <button data-btn="a" class="a">A</button>
      </div>
    </div>
  </div>
  <button id="mute" title="Toggle sound (M)">&#9835;</button>
  <script type="module" src="src/main.js"></script>
</body>
</html>
